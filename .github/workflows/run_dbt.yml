name: run dbt

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.8.0 dbt-snowflake==1.8.0
          dbt --version

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Create profiles.yml
        run: |
          cat > ~/.dbt/profiles.yml << 'YML'
          default:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: SPOTIFY_ANALYTICS
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: bronze
                threads: 4
                client_session_keep_alive: false
          YML

      - name: Debug - Check profiles.yml
        run: |
          echo "Checking profiles.yml exists..."
          ls -la ~/.dbt/
          echo "Profile content (masked):"
          grep -v password ~/.dbt/profiles.yml

      - name: Run dbt deps
        run: dbt deps --project-dir dbt --profiles-dir ~/.dbt

      - name: Run dbt debug
        run: dbt debug --project-dir dbt --profiles-dir ~/.dbt

      - name: Run dbt build
        run: dbt build --project-dir dbt --profiles-dir ~/.dbt --target prod

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/logs/dbt.log
          retention-days: 30
