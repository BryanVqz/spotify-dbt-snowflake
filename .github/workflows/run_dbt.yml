name: run dbt

on:
  workflow_run:
    workflows: ["Load S3 landing files to Snowflake"]
    types: [completed]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dbt:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: /home/runner/.dbt
      DBT_PROJECT_DIR: dbt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.8.0 dbt-snowflake==1.8.0
          dbt --version

      - name: Create dbt profiles directory
        run: mkdir -p "$DBT_PROFILES_DIR"

      - name: Create profiles.yml
        run: |
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YML'
          default:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 4
                client_session_keep_alive: false
          YML

      - name: Run dbt deps
        run: dbt deps --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$DBT_PROFILES_DIR"

      - name: Run dbt build
        run: dbt build --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$DBT_PROFILES_DIR" --target prod
